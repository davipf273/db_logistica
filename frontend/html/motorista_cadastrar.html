<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/motorista_cadastrar.js" defer></script>
    <title>Cadastrar Motorista</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Motorista</h1>
        <form>

            <label for="nome">Nome</label><br>
            <input type="text" id="nome"><br><br>

            <label for="cnh">CNH</label><br>
            <input type="text" id="cnh"><br><br>

            <label for="cpf">CPF (somente números)</label><br>
            <input type="text" id="cpf" maxlength="11" inputmode="numeric"><br><br>

            <label for="telefone">Telefone (DDD + número)</label><br>
            <input type="text" id="telefone" maxlength="11" inputmode="numeric"><br><br>

            <button type="button" id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
