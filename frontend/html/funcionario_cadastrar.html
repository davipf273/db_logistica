<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/funcionario_cadastrar.js" defer></script>
    <title>Cadastrar Funcionario</title>
</head>

<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br>
        <hr><br>
    </header>
    <main>
        <h1>Cadastrar Funcionario</h1>
        <form>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>

            <label for="senha">Senha</label><br>
            <input type="password" id="senha" required><br><br>

            <button type="button" id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>

</html>
